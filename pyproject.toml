[project]
name = "assignment-2-moe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "datasets>=5.0.1",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.2",
    "torch>=2.9.0",
    "transformers>=4.57.0",
    "wandb>=0.29.0",
]

# Install the CUDA build of PyTorch on Linux and Windows.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
